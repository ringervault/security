name: ringer_vault
description: "Ringer Vault's security code: the vault file, key handling, sync encryption, autofill caller checks and the save inbox, with their tests."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0
  uuid: ^4.5.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  local_auth: ^2.3.0
  local_auth_android: ^1.0.56
  local_auth_darwin: ^1.6.1
  connectivity_plus: ^6.1.1
  crypto: ^3.0.3
  cryptography: ^2.7.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
